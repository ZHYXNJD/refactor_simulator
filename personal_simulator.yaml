name: my_torch_env
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  # 核心版本
  - python=3.10
  - pytorch=2.8
  - torchvision
  - torchaudio
  - pytorch-cuda=12.8

  # 可视化与开发
  - tensorboard
  - jupyterlab
  - ipykernel

  # 科学计算
  - numpy
  - pandas
  - matplotlib

  # 你原始环境中的通用依赖（保留但去掉具体构建号，避免解析冲突）
  - absl-py
  - aiohttp
  - aiosignal
  - appdirs
  - async-timeout
  - blinker
  - bottleneck
  - brotlipy
  - c-ares
  - cachetools
